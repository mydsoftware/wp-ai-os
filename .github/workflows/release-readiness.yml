name: آمادگی انتشار

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    name: بررسی آمادگی انتشار
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: بررسی ساختار افزونه
        shell: bash
        run: |
          set -euo pipefail
          test -f wp-ai-os.php
          test -f readme.txt
          test -f uninstall.php
          test -d includes
          test -d admin
          test -d api

      - name: بررسی Metadata وردپرس
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^ \* Plugin Name:' wp-ai-os.php
          grep -Eq '^ \* Version:' wp-ai-os.php
          grep -Eq '^ \* Requires at least:' wp-ai-os.php
          grep -Eq '^ \* Requires PHP:' wp-ai-os.php
          grep -Eq '^Requires at least:' readme.txt
          grep -Eq '^Requires PHP:' readme.txt
          grep -Eq '^Stable tag:' readme.txt

      - name: بررسی فایل‌های حساس و توسعه‌ای
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$'
          ! git ls-files | grep -E '(^|/)(node_modules|vendor)/'

      - name: بررسی نحو PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: ساخت و اعتبارسنجی بسته انتشار
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/wp-ai-os
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' --exclude='node_modules' --exclude='vendor' ./ build/wp-ai-os/
          test -f build/wp-ai-os/wp-ai-os.php
          test -f build/wp-ai-os/readme.txt
          cd build
          zip -qr wp-ai-os.zip wp-ai-os
          unzip -t wp-ai-os.zip
          test -s wp-ai-os.zip

      - name: انتشار Artifact
        uses: actions/upload-artifact@v4
        with:
          name: بسته-انتشار-wp-ai-os
          path: build/wp-ai-os.zip
          if-no-files-found: error
          retention-days: 14

      - name: نتیجه نهایی
        run: echo 'بررسی آمادگی انتشار با موفقیت انجام شد.'
