name: Release Notification

on:
  release:
    types: [published]

permissions:
  issues: write
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const release = context.payload.release;
            const tag = release.tag_name || 'unknown';
            const name = release.name || `WP AI OS ${tag}`;
            const url = release.html_url;
            const body = [
              '@mydsoftware',
              '',
              `## 🚀 ${name} — Release Ready`,
              '',
              'The WP AI OS release has been published and the automated release pipeline completed.',
              '',
              `- **Version:** ${tag}`,
              `- **Release:** ${url}`,
              '- **Status:** FINAL RELEASE READY',
              '',
              'This issue was created automatically to trigger a GitHub notification.'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 ${name} — Release Ready`,
              body,
              labels: []
            });
