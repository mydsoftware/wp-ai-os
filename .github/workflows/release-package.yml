name: Build Plugin Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: ساخت بسته پاک انتشار
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wp-ai-os
          rsync -a ./ dist/wp-ai-os/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='sprint*.sh' \
            --exclude='dist' \
            --exclude='phpunit.xml' \
            --exclude='phpunit.xml.dist' \
            --exclude='.wp-env.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='pnpm-lock.yaml' \
            --exclude='yarn.lock' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.editorconfig' \
            --exclude='composer.json' \
            --exclude='composer.lock'
          rm -f dist/wp-ai-os/.env.example
          test -f dist/wp-ai-os/wp-ai-os.php
          test -f dist/wp-ai-os/readme.txt
          test -f dist/wp-ai-os/LICENSE
          (cd dist && zip -qr wp-ai-os.zip wp-ai-os)

      - name: بررسی بسته نهایی
        shell: bash
        run: |
          set -euo pipefail
          unzip -l dist/wp-ai-os.zip
          ! unzip -l dist/wp-ai-os.zip | grep -E '(^|/)(\.git|\.github|tests|docs|phpunit\.xml|phpunit\.xml\.dist|\.wp-env\.json|package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|\.gitignore|\.gitattributes|\.editorconfig|composer\.json|composer\.lock)(/|$)'

      - name: بارگذاری بسته انتشار
        uses: actions/upload-artifact@v4
        with:
          name: wp-ai-os-${{ github.ref_name }}
          path: dist/wp-ai-os.zip
