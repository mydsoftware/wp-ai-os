name: Build Plugin Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: ساخت بسته پاک انتشار
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/wp-ai-os
          rsync -a ./ dist/wp-ai-os/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='sprint*.sh' \
            --exclude='dist' \
            --exclude='phpunit.xml' \
            --exclude='phpunit.xml.dist' \
            --exclude='.wp-env.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='pnpm-lock.yaml' \
            --exclude='yarn.lock' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.editorconfig' \
            --exclude='composer.json' \
            --exclude='composer.lock'
          rm -f dist/wp-ai-os/.env.example
          test -f dist/wp-ai-os/wp-ai-os.php
          test -f dist/wp-ai-os/readme.txt
          test -f dist/wp-ai-os/LICENSE
          (cd dist && zip -qr wp-ai-os.zip wp-ai-os)

      - name: بررسی بسته نهایی
        shell: bash
        run: |
          set -euo pipefail
          unzip -l dist/wp-ai-os.zip
          ! unzip -l dist/wp-ai-os.zip | grep -E '(^|/)(\.git|\.github|tests|docs|phpunit\.xml|phpunit\.xml\.dist|\.wp-env\.json|package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|\.gitignore|\.gitattributes|\.editorconfig|composer\.json|composer\.lock)(/|$)'
          rm -rf /tmp/wp-ai-os-audit
          mkdir -p /tmp/wp-ai-os-audit
          unzip -q dist/wp-ai-os.zip -d /tmp/wp-ai-os-audit
          test -f /tmp/wp-ai-os-audit/wp-ai-os/wp-ai-os.php
          test -f /tmp/wp-ai-os-audit/wp-ai-os/readme.txt
          test -f /tmp/wp-ai-os-audit/wp-ai-os/LICENSE
          ! find /tmp/wp-ai-os-audit/wp-ai-os -type f -name '*.zip' -print -quit | grep -q .

      - name: آماده‌سازی Artifact مستقیم افزونه
        shell: bash
        run: |
          set -euo pipefail
          cp dist/wp-ai-os.zip wp-ai-os.zip
          sha256sum wp-ai-os.zip

      - name: بارگذاری بسته برای نگهداری CI
        uses: actions/upload-artifact@v4
        with:
          name: wp-ai-os-${{ github.ref_name }}
          path: wp-ai-os.zip

      - name: انتشار فایل مستقیم در GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" wp-ai-os.zip --clobber
